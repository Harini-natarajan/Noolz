<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2238"/>
      <stop offset="45%" stop-color="#1F2A44"/>
      <stop offset="85%" stop-color="#2D3A58"/>
      <stop offset="100%" stop-color="#8A0B45"/>
    </linearGradient>
    <radialGradient id="playGlow" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D39E57" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A9C7E0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgKids)"/>
  <rect width="1920" height="1080" fill="url(#playGlow)"/>

  <!-- Playful constellation & stars -->
  <g opacity="0.35">
    <circle cx="1200" cy="220" r="6" fill="#D39E57"/>
    <circle cx="1400" cy="160" r="10" fill="#FAF6EE"/>
    <circle cx="1650" cy="260" r="8" fill="#D39E57"/>
    <circle cx="1500" cy="480" r="12" fill="#EBC6C3"/>
    <line x1="1200" y1="220" x2="1400" y2="160" stroke="#FAF6EE" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1400" y1="160" x2="1650" y2="260" stroke="#FAF6EE" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1420" cy="380" r="260" fill="none" stroke="#D39E57" stroke-width="1.5" stroke-dasharray="8 8"/>
  </g>

  <!-- Stylized Kids' T-shirt Silhouette Illustration -->
  <g transform="translate(1220, 290) scale(1.05)">
    <ellipse cx="200" cy="480" rx="140" ry="18" fill="#000000" opacity="0.3"/>
    <!-- Kids Tee -->
    <path d="M120 70 L60 95 L10 200 L60 225 L95 180 L95 450 Q95 465 110 465 L290 465 Q305 465 305 450 L305 180 L340 225 L390 200 L340 95 L280 70 Q255 120 200 120 Q145 120 120 70 Z" fill="#1F2A44" stroke="#D39E57" stroke-width="2.5"/>
    <!-- Collar -->
    <path d="M120 70 Q145 120 200 120 Q255 120 280 70" fill="none" stroke="#D39E57" stroke-width="5" stroke-linecap="round"/>
    <!-- Rocket & Planet Graphic -->
    <g transform="translate(200, 260) scale(1.15)">
      <g transform="rotate(35)">
        <path d="M0 -60 C22 -35 22 0 14 20 H-14 C-22 0 -22 -35 0 -60 Z" fill="#FAF6EE"/>
        <circle cy="-20" r="8" fill="#D39E57"/>
        <path d="M-14 6 L-30 25 L-14 20 Z M14 6 L30 25 L14 20 Z" fill="#8A0B45"/>
      </g>
      <text x="0" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" letter-spacing="3" fill="#FAF6EE">BLAST OFF!</text>
      <text x="0" y="98" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#D39E57">HAPPY DAYS</text>
    </g>
  </g>

  <!-- Editorial watermark -->
  <text x="1840" y="960" text-anchor="end" font-family="Georgia,serif" font-size="120" font-weight="700" fill="#FAF6EE" opacity="0.04" letter-spacing="12">KIDS' CLUB</text>
</svg>
