<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1713"/>
      <stop offset="40%" stop-color="#36281E"/>
      <stop offset="80%" stop-color="#5E3823"/>
      <stop offset="100%" stop-color="#8A0B45"/>
    </linearGradient>
    <radialGradient id="toteGlow" cx="78%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D39E57" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#B8823D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgTote)"/>
  <rect width="1920" height="1080" fill="url(#toteGlow)"/>

  <!-- Minimal lifestyle geometry -->
  <g opacity="0.2">
    <circle cx="1400" cy="380" r="300" fill="none" stroke="#D39E57" stroke-width="1.5"/>
    <circle cx="1400" cy="380" r="190" fill="#D39E57" fill-opacity="0.1"/>
    <rect x="1150" y="160" width="500" height="600" rx="20" fill="none" stroke="#FAF6EE" stroke-width="1.5" stroke-dasharray="10 8"/>
  </g>

  <!-- Stylized Tote Bag Illustration -->
  <g transform="translate(1220, 260) scale(1.15)">
    <ellipse cx="180" cy="510" rx="160" ry="20" fill="#000000" opacity="0.35"/>
    <!-- Handles -->
    <path d="M110 160 C110 40 250 40 250 160" fill="none" stroke="#D39E57" stroke-width="16" stroke-linecap="round"/>
    <path d="M110 160 C110 40 250 40 250 160" fill="none" stroke="#FAF6EE" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Bag body -->
    <path d="M40 150 H320 L340 480 Q340 495 325 495 H35 Q20 495 20 480 Z" fill="#EFE4CC" stroke="#D39E57" stroke-width="2.5"/>
    <!-- Seam line -->
    <path d="M40 175 H320" stroke="#8A0B45" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Printed Art on Tote -->
    <g transform="translate(180, 310) scale(1.15)">
      <circle cx="40" cy="-35" r="16" fill="#D39E57"/>
      <path d="M-70 40 L-25 -25 L5 15 L25 -10 L70 40 Z" fill="#8A0B45"/>
      <text x="0" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="700" letter-spacing="3" fill="#1B1517">WANDER MORE</text>
      <text x="0" y="86" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="600" letter-spacing="3" fill="#8A0B45">CANVAS ESSENTIAL</text>
    </g>
  </g>

  <!-- Editorial watermark -->
  <text x="1840" y="960" text-anchor="end" font-family="Georgia,serif" font-size="120" font-weight="700" fill="#FAF6EE" opacity="0.04" letter-spacing="12">TOTE BAGS</text>
</svg>
